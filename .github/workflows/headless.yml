name: Headless

on:
  pull_request:
  push:
    branches: [master]

jobs:
  real-facade:
    name: Real emuctl facade (pinned)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # The headless extra pins the unpublished emuctl build. Installing it here
      # keeps the real-facade test from being skipped by its importorskip.
      - name: Sync with the optional headless backend
        run: uv sync --extra headless

      - name: Run the real-facade shim test
        run: uv run pytest tests/test_emuctl_adapter.py -k real_facade -q
